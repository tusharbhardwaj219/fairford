# Render Blueprint — Fair Ford Pharma
# A single Node web service runs the Express API AND serves the static frontend
# (server.js serves ../frontend and ../image relative to backend/).
# Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fairford-pharma
    runtime: node
    rootDir: backend            # repo root holds backend/ frontend/ image/
    plan: free                  # free spins down after ~15m idle (cold start ~30-60s).
                                # Switch to "starter" ($7/mo) to keep it always-on for launch.
    region: singapore           # closest Render region to India; change if you prefer
    branch: main
    buildCommand: npm install   # uses committed package-lock.json
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true            # redeploys on every push to main
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://fairfordpharma.com
      - key: JWT_EXPIRES_IN
        value: 7d
      # ── Secrets: set these in the Render dashboard (sync:false = not stored in git) ──
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
